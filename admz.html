<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiapJek - Panel Admin Ultra Pro (Google Maps)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Alpine.js & Firebase Compat (App, Database, & Auth) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  
  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDfIDw6sjKoT-XuNYf8AUMMsQSFZ_jvScg&libraries=places"></script>

  <style>
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #google-toko-map { height: 280px; width: 100%; border-radius: 12px; z-index: 1; }
    #google-order-map { height: 350px; width: 100%; border-radius: 12px; z-index: 1; }
    #google-live-driver-map { height: 380px; width: 100%; display: block; border-radius: 12px; z-index: 1; position: relative; }
  </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

  <div x-data="adminPanel()" class="flex flex-col min-h-screen">

    <!-- LOGIN SCREEN (EMAIL & PASSWORD FIREBASE) -->
    <div x-show="!isLoggedIn" x-cloak class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl border border-slate-200">
        <div class="text-center space-y-2">
          <div class="w-14 h-14 rounded-2xl bg-orange-500 text-white font-black text-2xl flex items-center justify-center mx-auto shadow-lg">SJ</div>
          <h2 class="text-xl font-black text-slate-800">SiapJek Admin Pro</h2>
          <p class="text-xs text-slate-500">Gunakan akun admin Firebase Anda</p>
        </div>
        
        <form @submit.prevent="loginAdminEmail()" class="space-y-3">
          <div>
            <input type="email" x-model="inputEmail" placeholder="Email Admin" class="w-full p-3 bg-slate-50 border rounded-xl text-xs outline-none focus:border-emerald-600 font-bold tracking-wide mb-3" required autofocus>
            <input type="password" x-model="inputPassword" placeholder="Password" class="w-full p-3 bg-slate-50 border rounded-xl text-xs outline-none focus:border-emerald-600 font-bold tracking-wide" required>
          </div>
          <button type="submit" :disabled="isLoggingIn" class="w-full bg-emerald-700 hover:bg-emerald-800 disabled:bg-slate-400 text-white font-black py-3 rounded-xl shadow-md text-xs transition-all flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-lock-open" x-show="!isLoggingIn"></i> 
            <i class="fa-solid fa-spinner fa-spin" x-show="isLoggingIn"></i>
            <span x-text="isLoggingIn ? 'MEMPROSES...' : 'MASUK PANEL ADMIN'"></span>
          </button>
        </form>
      </div>
    </div>

    <!-- MAIN PANEL -->
    <template x-if="isLoggedIn">
      <div class="flex flex-col min-h-screen">
        <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-30">
          <div class="px-4 py-3 flex items-center justify-between border-b border-emerald-700">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg bg-orange-500 text-white flex items-center justify-center font-black text-sm shadow-md">SJ</div>
              <div>
                <h1 class="font-black text-xs tracking-wide">SiapJek Admin Pro</h1>
                <p class="text-[10px] text-emerald-200" x-text="currentUserEmail ? 'Auth: ' + currentUserEmail : 'Panel Kontrol Utama Samuda'"></p>
              </div>
            </div>
            <button @click="logoutAdmin()" class="bg-emerald-900 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </button>
          </div>
          
          <nav class="flex overflow-x-auto no-scrollbar px-3 py-2 gap-2 bg-emerald-900/60">
            <button @click="activeTab = 'overview'" :class="activeTab === 'overview' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
            <button @click="activeTab = 'orders'" :class="activeTab === 'orders' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-receipt"></i> Pesanan <span x-show="orders.filter(o => o.status === 'pending' || o.status === 'waiting_merchant').length > 0" x-text="orders.filter(o => o.status === 'pending' || o.status === 'waiting_merchant').length" class="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full ml-1 animate-pulse"></span></button>
            <button @click="activeTab = 'live_drivers'" :class="activeTab === 'live_drivers' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-location-crosshairs"></i> Live Driver</button>
            <button @click="activeTab = 'chats'" :class="activeTab === 'chats' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-headset"></i> Live Chat <span x-show="totalUnreadChats > 0" x-text="totalUnreadChats" class="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full ml-1 animate-pulse"></span></button>
            <button @click="activeTab = 'customers'" :class="activeTab === 'customers' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0">
              <i class="fa-solid fa-users"></i> Pelanggan <span x-show="customers.length > 0" x-text="customers.length" class="bg-blue-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full ml-1"></span>
            </button>
            <button @click="activeTab = 'merchants'" :class="activeTab === 'merchants' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-store"></i> Mitra / Toko</button>
            <button @click="activeTab = 'products'" :class="activeTab === 'products' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-box-open"></i> Kelola Produk</button>
            <button @click="activeTab = 'drivers'" :class="activeTab === 'drivers' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-motorcycle"></i> Kelola Driver</button>
            <button @click="activeTab = 'finance'" :class="activeTab === 'finance' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-wallet"></i> Keuangan <span x-show="pendingWithdrawals.length + pendingTopups.length > 0" x-text="pendingWithdrawals.length + pendingTopups.length" class="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full ml-1 animate-pulse"></span></button>
            <button @click="activeTab = 'code_editor'" :class="activeTab === 'code_editor' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-code"></i> Editor Kode App</button>
            <button @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'bg-orange-500 text-white font-extrabold shadow-sm' : 'text-emerald-100 hover:bg-emerald-700/50'" class="px-3 py-2 rounded-xl text-xs whitespace-nowrap flex items-center gap-2 transition-all shrink-0"><i class="fa-solid fa-cogs"></i> Pengaturan</button>
          </nav>
        </header>

        <main class="flex-1 p-4 md:p-6 overflow-y-auto">
          
          <!-- TAB 1: DASHBOARD -->
          <div x-show="activeTab === 'overview'" x-cloak class="space-y-6">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
              <div class="bg-white p-4 rounded-2xl border shadow-xs"><span class="text-xs text-slate-400 font-bold block">PESANAN HARI INI</span><span class="text-xl font-black text-slate-800" x-text="getPesananHariIniCount()">0</span></div>
              <div class="bg-white p-4 rounded-2xl border shadow-xs"><span class="text-xs text-slate-400 font-bold block">MITRA TOKO</span><span class="text-xl font-black text-emerald-700" x-text="merchants.filter(m => m.kategori !== 'Motor' && m.kategori !== 'Jastip').length">0</span></div>
              <div class="bg-white p-4 rounded-2xl border shadow-xs"><span class="text-xs text-slate-400 font-bold block">PELANGGAN</span><span class="text-xl font-black text-blue-600" x-text="customers.length">0</span></div>
              <div class="bg-white p-4 rounded-2xl border shadow-xs"><span class="text-xs text-slate-400 font-bold block">DRIVER AKTIF</span><span class="text-xl font-black text-orange-500" x-text="drivers.filter(d => d.status === 'aktif').length">0</span></div>
              
              <div class="bg-gradient-to-br from-amber-500 to-orange-600 p-4 rounded-2xl shadow-xs text-white">
                <span class="text-xs text-amber-100 font-bold block uppercase truncate"><i class="fa-solid fa-calendar-day mr-1"></i> Komisi Hari Ini</span>
                <span class="text-xl font-black" x-text="'Rp ' + getKomisiHariIni().toLocaleString('id-ID')">Rp 0</span>
              </div>
              
              <div class="bg-gradient-to-br from-emerald-600 to-emerald-800 p-4 rounded-2xl shadow-xs text-white">
                <span class="text-xs text-emerald-200 font-bold block uppercase truncate"><i class="fa-solid fa-chart-line mr-1"></i> Total Komisi</span>
                <span class="text-xl font-black" x-text="'Rp ' + getTotalKomisi().toLocaleString('id-ID')">Rp 0</span>
              </div>
            </div>

              <!-- Pengaturan Loader Pelanggan: diseragamkan dengan Driver dan Mitra -->
            <div class="bg-white p-4 md:p-5 rounded-2xl border shadow-xs space-y-3 border-blue-200 bg-blue-50/20">
              <div class="border-b pb-2">
                <h3 class="text-xs font-black text-slate-800"><i class="fa-solid fa-user text-blue-600 mr-1.5"></i> Pengaturan Loader Pelanggan</h3>
                <p class="text-xs text-slate-500 mt-1">Pilih sumber aplikasi Pelanggan dan simpan URL hosting jika memakai Link.</p>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <label class="flex items-center gap-2 p-3 rounded-xl border-2 cursor-pointer" :class="loaderMode === 'source' ? 'border-blue-500 bg-blue-50' : 'border-slate-200'">
                  <input type="radio" name="loaderMode" value="source" x-model="loaderMode">
                  <span class="text-xs font-bold">Source Code Firebase</span>
                </label>
                <label class="flex items-center gap-2 p-3 rounded-xl border-2 cursor-pointer" :class="loaderMode === 'link' ? 'border-blue-500 bg-blue-50' : 'border-slate-200'">
                  <input type="radio" name="loaderMode" value="link" x-model="loaderMode">
                  <span class="text-xs font-bold">Link Hosting</span>
                </label>
              </div>
              <div class="flex gap-2">
                <input type="url" x-model="customerLinkInput" placeholder="https://pelanggan-siapjek.web.app" class="flex-1 min-w-0 p-2.5 bg-white border border-blue-200 rounded-xl text-xs font-bold">
                <button @click="saveCustomerLink()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shrink-0">Simpan Link</button>
              </div>
              <button @click="saveLoaderMode()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl">
                <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Metode Loader Pelanggan
              </button>
            </div>

            <!-- Pengaturan Loader Driver -->
            <div class="bg-white p-4 md:p-5 rounded-2xl border shadow-xs space-y-3 border-orange-200 bg-orange-50/20">
              <div class="border-b pb-2"><h3 class="text-xs font-black text-slate-800"><i class="fa-solid fa-motorcycle text-orange-600 mr-1.5"></i> Pengaturan Loader Driver</h3><p class="text-xs text-slate-500 mt-1">Pilih metode sumber aplikasi Driver dan simpan URL hosting jika memakai Link.</p></div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <label class="flex items-center gap-2 p-3 rounded-xl border-2 cursor-pointer" :class="driverLoaderMode === 'source' ? 'border-orange-500 bg-orange-50' : 'border-slate-200'"><input type="radio" name="driverLoaderMode" value="source" x-model="driverLoaderMode"><span class="text-xs font-bold">Source Code Firebase</span></label>
                <label class="flex items-center gap-2 p-3 rounded-xl border-2 cursor-pointer" :class="driverLoaderMode === 'link' ? 'border-orange-500 bg-orange-50' : 'border-slate-200'"><input type="radio" name="driverLoaderMode" value="link" x-model="driverLoaderMode"><span class="text-xs font-bold">Link Hosting</span></label>
              </div>
              <div class="flex gap-2"><input type="url" x-model="driverLinkInput" placeholder="https://driver-siapjek.web.app" class="flex-1 min-w-0 p-2.5 bg-white border border-orange-200 rounded-xl text-xs font-bold"><button @click="saveAppLoaderLink('driver')" class="bg-orange-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl">Simpan Link</button></div>
              <button @click="saveAppLoaderMode('driver')" class="w-full bg-orange-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl"><i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Metode Loader Driver</button>
            </div>

            <!-- Pengaturan Loader Mitra -->
            <div class="bg-white p-4 md:p-5 rounded-2xl border shadow-xs space-y-3 border-purple-200 bg-purple-50/20">
              <div class="border-b pb-2"><h3 class="text-xs font-black text-slate-800"><i class="fa-solid fa-store text-purple-600 mr-1.5"></i> Pengaturan Loader Mitra</h3><p class="text-xs text-slate-500 mt-1">Pilih metode sumber aplikasi Mitra dan simpan URL hosting jika memakai Link.</p></div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <label class="flex items-center gap-2 p-3 rounded-xl border-2 cursor-pointer" :class="mitraLoaderMode === 'source' ? 'border-purple-500 bg-purple-50' : 'border-slate-200'"><input type="radio" name="mitraLoaderMode" value="source" x-model="mitraLoaderMode"><span class="text-xs font-bold">Source Code Firebase</span></label>
                <label class="flex items-center gap-2 p-3 rounded-xl border-2 cursor-pointer" :class="mitraLoaderMode === 'link' ? 'border-purple-500 bg-purple-50' : 'border-slate-200'"><input type="radio" name="mitraLoaderMode" value="link" x-model="mitraLoaderMode"><span class="text-xs font-bold">Link Hosting</span></label>
              </div>
              <div class="flex gap-2"><input type="url" x-model="mitraLinkInput" placeholder="https://mitra-siapjek.web.app" class="flex-1 min-w-0 p-2.5 bg-white border border-purple-200 rounded-xl text-xs font-bold"><button @click="saveAppLoaderLink('mitra')" class="bg-purple-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl">Simpan Link</button></div>
              <button @click="saveAppLoaderMode('mitra')" class="w-full bg-purple-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl"><i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Metode Loader Mitra</button>
            </div>

            <!-- Rekening Tujuan Top-Up Admin -->
            <div class="bg-white p-4 md:p-5 rounded-2xl border shadow-xs space-y-3">
              <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-xs font-black text-slate-800"><i class="fa-solid fa-building-columns text-emerald-600 mr-1.5"></i> Rekening Tujuan Top-Up (Tampil di Aplikasi User/Driver/Mitra)</h3>
                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-wifi text-emerald-600 mr-1 animate-pulse"></i> Real-Time Synced</span>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                <div><label class="font-bold text-slate-600 block mb-1">Bank / E-Wallet:</label><input type="text" x-model="bankSettings.nama_bank" placeholder="Contoh: BCA / DANA / BRI" class="w-full p-2.5 bg-slate-50 border rounded-xl font-bold"></div>
                <div><label class="font-bold text-slate-600 block mb-1">No Rekening / No HP:</label><input type="text" x-model="bankSettings.nomor_rekening" placeholder="Contoh: 1234567890" class="w-full p-2.5 bg-slate-50 border rounded-xl font-bold text-emerald-700"></div>
                <div><label class="font-bold text-slate-600 block mb-1">Atas Nama (A/N):</label><input type="text" x-model="bankSettings.atas_nama" placeholder="Contoh: Admin SiapJek" class="w-full p-2.5 bg-slate-50 border rounded-xl font-bold"></div>
              </div>
              <div class="flex gap-2">
                <button @click="saveBankSettings()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm transition-all"><i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Rekening</button>
              </div>
            </div>

            <!-- Banner Utama & Running Text -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-white p-4 md:p-5 rounded-2xl border shadow-xs space-y-3">
                <h3 class="text-xs font-black text-slate-800 border-b pb-2"><i class="fa-solid fa-image text-emerald-600 mr-1.5"></i> Banner Utama Aplikasi</h3>
                <div class="grid grid-cols-1 gap-2.5 text-xs">
                  <div><label class="font-bold text-slate-600 block mb-1">Tagline:</label><input type="text" x-model="topBanner.tag" class="w-full p-2 bg-slate-50 border rounded-xl"></div>
                  <div><label class="font-bold text-slate-600 block mb-1">Judul Utama:</label><input type="text" x-model="topBanner.title" class="w-full p-2 bg-slate-50 border rounded-xl"></div>
                  <div><label class="font-bold text-slate-600 block mb-1">Deskripsi Singkat:</label><input type="text" x-model="topBanner.desc" class="w-full p-2 bg-slate-50 border rounded-xl"></div>
                  <div><label class="font-bold text-slate-600 block mb-1">Unggah Ikon/Gambar:</label><input type="file" accept="image/*" @change="uploadAndCompressImage($event, topBanner, 'img')" class="w-full text-xs p-1 bg-slate-50 border rounded-xl"></div>
                </div>
                <div x-show="topBanner.img" class="mt-2"><img :src="topBanner.img" class="w-16 h-16 object-contain border rounded-xl p-1 bg-slate-50"></div>
                <button @click="saveTopBanner()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm">Simpan Banner</button>
              </div>

              <div class="bg-white p-4 md:p-5 rounded-2xl border shadow-xs space-y-3 flex flex-col justify-between">
                <div>
                  <h3 class="text-xs font-black text-slate-800 border-b pb-2"><i class="fa-solid fa-bullhorn text-orange-500 mr-1.5"></i> Running Text / Pengumuman</h3>
                  <p class="text-xs text-slate-500 mb-2">Teks berjalan di halaman depan aplikasi pelanggan.</p>
                  <textarea x-model="runningText" rows="4" class="w-full text-xs p-3 bg-slate-50 border rounded-xl font-medium outline-none"></textarea>
                </div>
                <button @click="saveRunningText()" class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm">Simpan Running Text</button>
              </div>
            </div>

            <!-- Slide Promo -->
            <div class="bg-white p-4 md:p-5 rounded-2xl border shadow-xs space-y-4">
              <div class="border-b pb-2">
                <h3 class="text-xs font-black text-slate-800">🖼️ Kelola 3 Slide Promo Pelanggan</h3>
                <p class="text-[11px] text-slate-500">Rasio tampilan gambar presisi sesuai slider promo beranda aplikasi.</p>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <template x-for="slot in [1, 2, 3]" :key="slot">
                  <div class="bg-slate-50 border rounded-2xl p-3 space-y-2">
                    <div class="flex justify-between items-center">
                      <span class="text-xs font-black text-slate-700" x-text="'Slide Promo ' + slot"></span>
                      <button x-show="adminPromos['slide_'+slot]" @click="deletePromoSlide('slide_'+slot)" class="text-xs bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded-lg">Hapus</button>
                    </div>
                    <div class="w-full h-28 bg-slate-200 rounded-xl overflow-hidden border relative flex justify-center items-center shadow-inner">
                      <template x-if="adminPromos['slide_'+slot] && adminPromos['slide_'+slot].gambar">
                        <img :src="adminPromos['slide_'+slot].gambar" class="w-full h-full object-cover">
                      </template>
                      <template x-if="!adminPromos['slide_'+slot]">
                        <span class="text-xs text-slate-400 font-bold">📷 Belum ada gambar</span>
                      </template>
                    </div>
                    <input type="file" accept="image/*" @change="uploadSlideDirect($event, slot)" class="w-full text-xs p-1 bg-white border rounded-lg cursor-pointer">
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- TAB 2: PESANAN -->
          <div x-show="activeTab === 'orders'" x-cloak class="space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
              <div>
                <h3 class="text-sm font-black text-slate-800">📦 Real-Time Monitoring Pesanan</h3>
                <p class="text-xs text-slate-500">Menampilkan pesanan dalam sistem (pesanan selesai > 7 hari otomatis terhapus).</p>
              </div>
              <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <input type="text" x-model="searchOrder" placeholder="🔍 Cari ID / Nama / Driver..." class="w-full md:w-60 p-2 bg-white border rounded-xl text-xs outline-none">
              </div>
            </div>

    function playNotificationSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) { console.log('Audio notification bypassed:', e); }
    }

cleanUpOldOrders() {
          let tujuhHariMs = 7 * 24 * 60 * 60 * 1000;
          let waktuSekarang = Date.now();

          db.ref('orders').once('value', snap => {
            if (snap.exists()) {
              snap.forEach(c => {
                let ord = c.val();
                let statusOrder = (ord.status || '').toLowerCase().trim();
                let waktuOrder = ord.timestamp || ord.waktu || 0;

                if (['selesai', 'dibatalkan', 'ditolak'].includes(statusOrder) && waktuOrder > 0) {
                  if (waktuSekarang - waktuOrder > tujuhHariMs) {
                    db.ref('orders/' + c.key).remove();
                  }
                }
              });
            }
          });
        },

        // Simpan metode yang harus digunakan loader pelanggan
        // Memastikan URL hosting benar sebelum disimpan ke Firebase.
        validLoaderUrl(value) {
          try {
            const url = new URL(String(value || '').trim());
            return (url.protocol === 'https:' || url.protocol === 'http:') && !!url.hostname;
          } catch (e) { return false; }
        },

        // Simpan metode loader Pelanggan. Jika memilih Link Hosting,
        // URL yang diisi ikut disimpan terlebih dahulu agar pilihan langsung siap digunakan.
        saveLoaderMode() {
          const mode = this.loaderMode === 'link' ? 'link' : 'source';
          const value = String(this.customerLinkInput || '').trim();
          if (mode === 'link' && !this.validLoaderUrl(value)) {
            alert('⚠️ Isi Link Hosting Pelanggan dengan URL http:// atau https:// yang valid, lalu tekan Simpan Metode Loader.');
            return;
          }
          const saveMode = () => db.ref('loader_settings/mode').set(mode);
          const saveTask = mode === 'link' ? db.ref('customer_link').set(value).then(saveMode) : saveMode();
          saveTask.then(() => alert('✅ Metode loader Pelanggan berhasil disimpan: ' + (mode === 'link' ? 'Link Hosting' : 'Source Code Firebase') + '.'))
            .catch(err => alert('❌ Gagal menyimpan metode loader Pelanggan: ' + (err && err.message ? err.message : err)));
        },

        // Simpan metode loader Driver atau Mitra dengan jalur Firebase masing-masing.
        saveAppLoaderMode(type) {
          const isDriver = type === 'driver';
          const mode = (isDriver ? this.driverLoaderMode : this.mitraLoaderMode) === 'link' ? 'link' : 'source';
          const value = String(isDriver ? this.driverLinkInput : this.mitraLinkInput || '').trim();
          const modePath = isDriver ? 'loader_settings/driver_mode' : 'loader_settings/mitra_mode';
          const linkPath = isDriver ? 'driver_link' : 'mitra_link';
          const appName = isDriver ? 'Driver' : 'Mitra';
          if (mode === 'link' && !this.validLoaderUrl(value)) {
            alert('⚠️ Isi Link Hosting ' + appName + ' dengan URL http:// atau https:// yang valid, lalu tekan Simpan Metode Loader.');
            return;
          }
          const saveMode = () => db.ref(modePath).set(mode);
          const saveTask = mode === 'link' ? db.ref(linkPath).set(value).then(saveMode) : saveMode();
          saveTask.then(() => alert('✅ Metode loader ' + appName + ' berhasil disimpan: ' + (mode === 'link' ? 'Link Hosting' : 'Source Code Firebase') + '.'))
            .catch(err => alert('❌ Gagal menyimpan metode loader ' + appName + ': ' + (err && err.message ? err.message : err)));
        },

        saveAppLoaderLink(type) {

          const value = String((isDriver ? this.driverLinkInput : this.mitraLinkInput) || '').trim();
          if (!value) return alert('⚠️ Link aplikasi tidak boleh kosong.');
          if (!this.validLoaderUrl(value)) return alert('⚠️ Masukkan URL lengkap yang valid dan diawali https:// atau http://');
          const path = isDriver ? 'driver_link' : 'mitra_link';

            .catch(err => alert('❌ Gagal menyimpan link: ' + (err && err.message ? err.message : err)));
        },

        // Simpan URL hosting aplikasi Pelanggan.
        saveCustomerLink() {

        bersihkanSeluruhDatabaseFirebase() {
          let konfirmasi1 = confirm("⚠ PERINGATAN KERAS!\n\nTindakan ini akan MENGHAPUS PERMANEN seluruh riwayat pesanan, riwayat chat, mutasi saldo, permohonan top-up, permohonan tarik dana, dan log dari database Firebase.\n\nData yang dihapus TIDAK DAPAT DIKEMBALIKAN. Lanjutkan?");
          
          if (!konfirmasi1) return;

          let konfirmasi2 = prompt("Ketik kata 'HAPUS' untuk mengonfirmasi pembersihan total database:");

            alert("❌ Konfirmasi dibatalkan. Kata kunci salah.");
            return;
          }

          alert("⏳ Sedang membersihkan database secara massal. Mohon tunggu beberapa saat...");

          let pathsToClean = ['orders', 'order_chats', 'customer_chats', 'driver_chats', 'merchant_chats', 'mutasi_saldo', 'topups', 'withdrawals', 'notifications'];

          let promises = pathsToClean.map(path => {

              alert("❌ Terjadi kesalahan saat menghapus data: " + error.message);

        loadCodeFromFile(event, type) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            this.appCodes[type] = e.target.result;
            this.appFileNames[type] = file.name;
            alert(`✅ Berhasil memuat isi file ${file.name} ke editor ${type}! Jangan lupa klik tombol Simpan.`);
            event.target.value = '';
          };
          reader.readAsText(file);
        },

        downloadAppCode(type) {
          const codeContent = this.appCodes[type] || '';
          const fileName = this.appFileNames[type] || (type + '.html');
          const blob = new Blob([codeContent], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        },

        saveAppCode(type) {
          if (!confirm(`Simpan dan sinkronkan kode sumber beserta nama file ${type} ke database secara permanen?`)) return;
          let updates = {};
          updates['source_code/' + type] = this.appCodes[type];
          updates['source_code/' + type + '_meta'] = { filename: this.appFileNames[type], updatedAt: Date.now() };

          db.ref().update(updates).then(() => {

        getCustomerName(custId) { 
          let found = this.customers.find(c => c.uid === custId || c.id === custId); 
          return found ? found.nama : (custId || 'Pelanggan'); 
        },
        getCustomerHp(custId) {
          let found = this.customers.find(c => c.uid === custId || c.id === custId); 
          return found ? found.no_hp : '';
        },
        getDriverName(drvId) { let found = this.drivers.find(d => d.id === drvId); return found ? found.nama : drvId; },
        getMerchantName(merchId) { let found = this.merchants.find(m => m.id === merchId); return found ? found.nama_toko : merchId; },
        // Terima format foto dari aplikasi pelanggan, driver, dan mitra:
        // {foto: dataURL}, {pesan: dataURL, tipe:'image'}, atau field gambar/image/url.
        getChatImage(msg) {
          if (!msg || typeof msg !== 'object') return '';
          const candidates = [msg.foto, msg.gambar, msg.image, msg.imageUrl, msg.image_url, msg.url];
          for (const value of candidates) {
            if (typeof value === 'string' && /^(data:image\/|https?:\/\/)/i.test(value.trim())) return value.trim();
          }
          const pesan = typeof msg.pesan === 'string' ? msg.pesan.trim() : '';
          if ((String(msg.tipe || '').toLowerCase() === 'image' || String(msg.tipe || '').toLowerCase() === 'foto' || /^data:image\//i.test(pesan)) && /^(data:image\/|https?:\/\/)/i.test(pesan)) return pesan;
          return '';
        },
        getChatText(msg) {
          if (!msg || typeof msg !== 'object') return '';
          const pesan = typeof msg.pesan === 'string' ? msg.pesan : '';
          if (this.getChatImage(msg) && (String(msg.tipe || '').toLowerCase() === 'image' || String(msg.tipe || '').toLowerCase() === 'foto' || /^data:image\//i.test(pesan))) {
            return msg.caption || msg.keterangan || msg.teks || '';
          }
          return pesan;
        },
        getLastMessage(chatObj) {
          if (!chatObj || typeof chatObj !== 'object') return '';
          const messages = Object.values(chatObj).filter(m => m && typeof m === 'object').sort((a, b) => (a.waktu || 0) - (b.waktu || 0));
          if (!messages.length) return '';
          const lastMsg = messages[messages.length - 1];
          if (this.getChatImage(lastMsg)) return lastMsg.caption || lastMsg.keterangan || '📷 [Gambar]';
          return lastMsg.pesan || '';
        },
        hasUnreadChat(chatObj) {
          if (!chatObj || typeof chatObj !== 'object') return false;
          return Object.values(chatObj).some(m => m && m.dibaca === false && m.pengirim !== 'admin');
        },
        get activeChatMessages() {
          if (!this.activeChatId) return [];
          let source = null;
          if (this.activeChatType === 'customer') source = this.allCustomerChats[this.activeChatId];
          else if (this.activeChatType === 'driver') source = this.allDriverChats[this.activeChatId];
          else source = this.allMerchantChats[this.activeChatId];

          if (!source || typeof source !== 'object') return [];
          return Object.values(source).filter(m => m && typeof m === 'object').sort((a, b) => (a.waktu || 0) - (b.waktu || 0));
        },
        get totalUnreadChats() {
          let count = 0;
          [this.allCustomerChats, this.allDriverChats, this.allMerchantChats].forEach(chatGroup => {
            if (chatGroup && typeof chatGroup === 'object') {
              Object.values(chatGroup).forEach(chatObj => {
                if (chatObj && typeof chatObj === 'object') {
                  Object.values(chatObj).forEach(m => {
                    if (m && m.dibaca === false && m.pengirim !== 'admin') count++;
                  });
                }
              });
            }
          });
          return count;
        },

        handleChatPhotoUpload(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let w = img.width, h = img.height;
              const max = 400;
              if (w > h && w > max) { h = Math.round((h * max) / w); w = max; } 
              else if (h > max) { w = Math.round((w * max) / h); h = max; }
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              this.adminChatPhotoPreview = canvas.toDataURL('image/webp', 0.35);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        },

        sendAdminReply() {
          if ((!this.adminReplyText.trim() && !this.adminChatPhotoPreview) || !this.activeChatId) return;
          let msgId = 'CHAT_' + Date.now();
          let path = '';
          if (this.activeChatType === 'customer') path = `customer_chats/${this.activeChatId}/${msgId}`;
          else if (this.activeChatType === 'driver') path = `driver_chats/${this.activeChatId}/${msgId}`;
          else path = `merchant_chats/${this.activeChatId}/${msgId}`;

          const teksBalasan = this.adminReplyText.trim();
          let chatPayload = {
            id: msgId,
            pengirim: 'admin',
            waktu: Date.now(),
            dibaca: true
          };

          if (this.adminChatPhotoPreview) {
            // Format kompatibel dengan aplikasi driver/pelanggan yang menyimpan
            // foto pada pesan + tipe:image; foto juga disalin ke field foto untuk
            // aplikasi yang memakai format lama. Teks opsional disimpan sebagai caption.
            chatPayload.pesan = this.adminChatPhotoPreview;
            chatPayload.tipe = 'image';
            chatPayload.foto = this.adminChatPhotoPreview;
            if (teksBalasan) chatPayload.caption = teksBalasan;
          } else {
            chatPayload.pesan = teksBalasan;
          }

          db.ref(path).set(chatPayload).then(() => {
            this.adminReplyText = '';
            this.adminChatPhotoPreview = null;
          }).catch(err => {
            alert('❌ Gagal mengirim chat: ' + err.message);
          });
        },

        async prosesKeuanganAdminSelesai(orderId, order) {
          const driverId = String(order.driver_id || '').trim();
          if (!driverId) throw new Error('Pesanan belum memiliki driver. Tugaskan driver sebelum menyelesaikan pesanan.');
          const gross = Math.max(0, Number(order.ongkir || 0));
          const persen = Math.max(0, Number(order.komisi_persen ?? 15));
          const commission = Math.max(0, Number(order.komisi_admin ?? order.potongan_komisi ?? (gross * persen / 100)));
          const netDriver = Math.max(0, gross - commission);
          const metode = String(order.metode_pembayaran || 'COD').trim().toLowerCase() === 'saldo' ? 'Saldo' : 'COD';
          const now = Date.now();
          const financeRef = db.ref('orders/' + orderId + '/keuangan_status');
          const claim = await financeRef.transaction(v => {
            if (v && v.status === 'done') return;
            if (v && v.status === 'processing' && (now - Number(v.started_at || 0)) < 60000) return;
            return { status: 'processing', started_at: now, driver_id: driverId, source: 'admin' };
          });
          if (!claim || !claim.committed) {
            const current = claim?.snapshot?.val?.() || {};
            if (current.status === 'done') return { alreadyProcessed: true };
            throw new Error('Keuangan pesanan sedang diproses oleh aplikasi lain. Coba lagi sebentar.');
          }
          const saldoDelta = metode === 'Saldo' ? netDriver : -commission;
          const updates = {};
          updates['drivers/' + driverId + '/saldo'] = firebase.database.ServerValue.increment(saldoDelta);
          updates['orders/' + orderId + '/keuangan_diproses'] = true;
          updates['orders/' + orderId + '/keuangan_diproses_pada'] = now;
          updates['orders/' + orderId + '/metode_pembayaran_keuangan'] = metode;
          updates['orders/' + orderId + '/komisi_persen'] = persen;
          updates['orders/' + orderId + '/komisi_admin'] = commission;
          updates['orders/' + orderId + '/pendapatan_driver'] = netDriver;
          updates['orders/' + orderId + '/saldo_driver_delta'] = saldoDelta;
          updates['orders/' + orderId + '/keuangan_status'] = { status: 'done', started_at: now, selesai_pada: now, driver_id: driverId, source: 'admin' };
          updates['admin_finance/orders/' + orderId] = {
            order_id: orderId, driver_id: driverId, gross_ongkir: gross,
            komisi_persen: persen, komisi_admin: commission, pendapatan_driver: netDriver,
            metode_pembayaran: metode, saldo_driver_delta: saldoDelta, timestamp: now, source: 'admin'
          };
          updates['driver_transactions/' + driverId + '/' + orderId] = {
            order_id: orderId, jenis: metode === 'Saldo' ? 'pendapatan_order' : 'potongan_komisi_cod',
            nominal: Math.abs(saldoDelta), saldo_delta: saldoDelta, gross_ongkir: gross,
            komisi_admin: commission, pendapatan_driver: netDriver, metode_pembayaran: metode,
            timestamp: now, keterangan: metode === 'Saldo' ? 'Pendapatan bersih order pembayaran SiapPay' : 'Potongan komisi admin dari saldo driver untuk order COD'
          };
          try {
            await db.ref().update(updates);
            return { alreadyProcessed: false };
          } catch (err) {
            try {
              await financeRef.transaction(v => {
                if (v && v.status === 'processing' && Number(v.started_at) === now && String(v.driver_id) === driverId) return null;
                return;
              });
            } catch (_) {}
            throw err;
          }
        },

        async updateOrderStatus(id, status) {
          if (status === 'dibatalkan') {
            let alasan = prompt('Tuliskan alasan pembatalan:');
            if (!alasan) return;
            try {
              await db.ref('orders/' + id).update({ status: status, alasan_batal: alasan });
            } catch (err) { alert('Gagal membatalkan pesanan. Periksa koneksi lalu coba lagi.'); }
            return;
          }
          try {
            const targetOrder = this.orders.find(o => String(o.id) === String(id));
            if (!targetOrder) throw new Error('Data pesanan tidak ditemukan. Muat ulang daftar pesanan.');
            if (status === 'selesai') {
              // Gunakan klaim keuangan yang sama dengan aplikasi driver agar tidak terhitung dua kali.
              await this.prosesKeuanganAdminSelesai(id, targetOrder);
            }
            await db.ref('orders/' + id).update({ status: status, ...(status === 'selesai' ? { selesai_pada: targetOrder.selesai_pada || Date.now() } : {}) });
            if (status === 'selesai') {
              let tokoId = targetOrder.toko_id;
              let items = targetOrder.detail_pesanan || [];
              if (items.length === 0 && targetOrder.id_produk) items = [{ id: targetOrder.id_produk, qty: 1 }];
              items.forEach(item => {
                let prodId = item.id;
                let qtyBeli = Number(item.qty || 1);
                if (tokoId && tokoId !== '-' && prodId) {
                  let refSold = db.ref(`produk/${tokoId}/${prodId}/sold_count`);
                  refSold.transaction(currentVal => (Number(currentVal) || 0) + qtyBeli);
                }
              });
            }
          } catch (err) {
            console.error('Gagal memperbarui status pesanan:', err);
            alert('❌ ' + ((err && err.message) || 'Status pesanan gagal diperbarui. Periksa koneksi lalu coba lagi.'));
          }
        },

        prosesTopUp() {
          if(!this.topUpForm.target_id || this.topUpForm.nominal <= 0) return alert('⚠ ID/UID & Nominal wajib diisi!');
          let targetId = this.topUpForm.target_id.trim();
          let refSaldo = (targetId.startsWith('DRV_')) ? db.ref('drivers/' + targetId + '/saldo') : (targetId.startsWith('TOKO_') ? db.ref('merchants/' + targetId + '/saldo') : db.ref('customers/' + targetId + '/saldo'));
          
          refSaldo.once('value').then(snap => {
            let n = Number(snap.val() || 0) + Number(this.topUpForm.nominal);
            refSaldo.set(n).then(() => {
              db.ref('mutasi_saldo').push({ user_id: targetId, nominal: Number(this.topUpForm.nominal), jenis: 'IN', keterangan: 'Top Up Manual Admin', timestamp: Date.now() });
              alert(`✅ Top Up Berhasil!\nSaldo Baru: Rp ${n.toLocaleString('id-ID')}`);
              this.topUpForm.target_id = ''; this.topUpForm.nominal = 0;
            });
          });
        },

        async approveWithdrawal(w) {
          const id = String(w.id || w._firebaseKey || '').trim();
          if (!id) return alert('ID penarikan tidak ditemukan.');
          const catatan = (prompt('Keterangan persetujuan (boleh dikosongkan):', 'Penarikan saldo telah disetujui Admin') || '').trim();
          if (!confirm('Setujui penarikan Rp ' + Number(w.nominal).toLocaleString('id-ID') + '?')) return;
          try {
            const ref = db.ref('withdrawals/' + id);
            const claim = await ref.transaction(current => {
              if (!current || current.status !== 'pending') return;
              return { ...current, status: 'processing', diproses_pada: Date.now(), diproses_oleh: firebase.auth().currentUser?.uid || 'admin' };
            });
            if (!claim.committed) return alert('Permohonan ini sudah diproses atau statusnya berubah. Muat ulang daftar keuangan.');
            const now = Date.now();
            const note = catatan || 'Penarikan saldo telah disetujui Admin';
            const updates = {};
            updates['withdrawals/' + id + '/status'] = 'selesai';
            updates['withdrawals/' + id + '/keterangan_admin'] = note;
            updates['withdrawals/' + id + '/catatan_admin'] = note;
            updates['withdrawals/' + id + '/disetujui_pada'] = now;
            updates['withdrawals/' + id + '/saldo_ditahan'] = false;
            if (String(w.user_type || '').toLowerCase() === 'driver' || String(w.user_id || '').startsWith('DRV_')) {
              updates['driver_transactions/' + w.user_id + '/' + id + '/status'] = 'selesai';
              updates['driver_transactions/' + w.user_id + '/' + id + '/keterangan'] = note;
              updates['driver_transactions/' + w.user_id + '/' + id + '/keterangan_admin'] = note;
              updates['driver_transactions/' + w.user_id + '/' + id + '/diproses_pada'] = now;
            }
            updates['mutasi_saldo/' + id] = { id, user_id: w.user_id, nominal: Number(w.nominal), jenis: 'OUT', keterangan: note, timestamp: now };
            await db.ref().update(updates);
            alert('Penarikan disetujui. Status dan keterangan telah dikirim ke aplikasi driver.');
          } catch (e) {
            console.error('Gagal menyetujui penarikan:', e);
            alert('Gagal menyelesaikan persetujuan. Periksa status permohonan sebelum mencoba lagi agar tidak terjadi transaksi ganda.');
          }
        },

        async rejectWithdrawal(w) {
          const id = String(w.id || w._firebaseKey || '').trim();
          if (!id) return alert('ID penarikan tidak ditemukan.');
          const note = (prompt('Alasan penolakan (wajib diisi):', 'Permohonan penarikan ditolak Admin') || '').trim();
          if (!note) return alert('Alasan penolakan wajib diisi.');
          if (!confirm('Tolak penarikan dan kembalikan saldo Rp ' + Number(w.nominal).toLocaleString('id-ID') + '?')) return;
          const targetId = String(w.user_id || '').trim();
          const prefix = targetId.startsWith('DRV_') ? 'drivers/' : (targetId.startsWith('TOKO_') || w.tipe === 'merchant' ? 'merchants/' : 'customers/');
          try {
            const ref = db.ref('withdrawals/' + id);
            const claim = await ref.transaction(current => {
              if (!current || current.status !== 'pending') return;
              return { ...current, status: 'processing', diproses_pada: Date.now(), diproses_oleh: firebase.auth().currentUser?.uid || 'admin' };
            });
            if (!claim.committed) return alert('Permohonan ini sudah diproses atau statusnya berubah. Muat ulang daftar keuangan.');
            const nominal = Number(w.nominal || 0);
            if (!Number.isSafeInteger(nominal) || nominal <= 0) throw new Error('Nominal pengembalian tidak valid.');
            // Saldo driver memang ditahan saat pengajuan; penolakan mengembalikannya satu kali.
            const saldoRef = db.ref(prefix + targetId + '/saldo');
            const refund = await saldoRef.transaction(current => Number(current || 0) + nominal);
            if (!refund.committed) throw new Error('Transaksi pengembalian saldo tidak berhasil.');
            const now = Date.now();
            const updates = {};
            updates['withdrawals/' + id + '/status'] = 'ditolak';
            updates['withdrawals/' + id + '/keterangan_admin'] = note;
            updates['withdrawals/' + id + '/catatan_admin'] = note;
            updates['withdrawals/' + id + '/alasan_penolakan'] = note;
            updates['withdrawals/' + id + '/ditolak_pada'] = now;
            updates['withdrawals/' + id + '/saldo_ditahan'] = false;
            updates['withdrawals/' + id + '/saldo_dikembalikan'] = true;
            if (String(w.user_type || '').toLowerCase() === 'driver' || targetId.startsWith('DRV_')) {
              updates['driver_transactions/' + targetId + '/' + id + '/status'] = 'ditolak';
              updates['driver_transactions/' + targetId + '/' + id + '/saldo_delta'] = 0;
              updates['driver_transactions/' + targetId + '/' + id + '/keterangan'] = 'Penarikan ditolak; saldo dikembalikan. ' + note;
              updates['driver_transactions/' + targetId + '/' + id + '/keterangan_admin'] = note;
              updates['driver_transactions/' + targetId + '/' + id + '/saldo_dikembalikan'] = true;
            }
            updates['mutasi_saldo/' + id] = { id, user_id: targetId, nominal, jenis: 'IN', keterangan: 'Pengembalian saldo penarikan ditolak: ' + note, timestamp: now };
            await db.ref().update(updates);
            alert('Penarikan ditolak dan saldo telah dikembalikan. Keterangan penolakan dikirim ke aplikasi driver.');
          } catch (e) {
            console.error('Gagal menolak penarikan:', e);
            alert('Proses pengembalian belum dapat dipastikan. Jangan klik ulang; periksa saldo dan status permohonan di Firebase terlebih dahulu.');
          }
        },

        async approveTopUp(t) {
          const id = String(t.id || t._firebaseKey || '').trim();
          if (!id) return alert('ID top up tidak ditemukan.');
          const nominal = Number(t.nominal_topup ?? t.nominal ?? 0);

          const note = (prompt('Keterangan persetujuan (boleh dikosongkan):', 'Top up saldo telah disetujui Admin') || '').trim();

            });

            const saldoTx = await saldoRef.transaction(current => Number(current || 0) + nominal);
            if (!saldoTx.committed) throw new Error('Penambahan saldo tidak berhasil.');

                id, jenis: 'topup_approved', nominal, saldo_delta: nominal, status: 'selesai',
                timestamp: Number(t.timestamp || t.created_at || now), diproses_pada: now,

        async rejectTopUp(t) {
          const id = String(t.id || t._firebaseKey || '').trim();
          if (!id) return alert('ID top up tidak ditemukan.');
          const note = (prompt('Alasan penolakan top up (wajib diisi):', 'Bukti transfer belum sesuai') || '').trim();
          if (!note) return alert('Alasan penolakan wajib diisi.');
          if (!confirm(`Tolak pengisian saldo dari ${t.user_nama || this.getCustomerName(t.user_id) || t.user_id}?`)) return;
          try {
            const now = Date.now();
            const ref = db.ref('topups/' + id);
            const result = await ref.transaction(current => {
              if (!current || current.status !== 'pending') return;
              return { ...current, status: 'ditolak', keterangan_admin: note, catatan_admin: note, alasan_penolakan: note, ditolak_pada: now, diproses_oleh: firebase.auth().currentUser?.uid || 'admin' };
            });
            if (!result.committed) return alert('Permohonan top up ini sudah diproses atau statusnya berubah.');
            alert('Permohonan top up ditolak. Keterangan penolakan telah dikirim ke aplikasi driver.');
          } catch (e) {
            console.error('Gagal menolak top up:', e);
            alert('Gagal menyimpan penolakan top up. Periksa koneksi lalu muat ulang daftar.');
          }
        },

        uploadAndCompressImage(event, targetObject, targetKey) {
          const file = event.target.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let w = img.width, h = img.height; const max = 300;
              if (w > h && w > max) { h = Math.round((h * max) / w); w = max; } else if (h > max) { w = Math.round((w * max) / h); h = max; }
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              targetObject[targetKey] = canvas.toDataURL('image/webp', 0.4);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        },

        uploadSlideDirect(event, slot) {
          const file = event.target.files[0]; if (!file) return;
          let title = prompt(`Judul Slide ${slot}:`, `Promo Spesial ${slot}`); if (!title) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let w = img.width, h = img.height; const max = 400;
              if (w > h && w > max) { h = Math.round((h * max) / w); w = max; } else if (h > max) { w = Math.round((w * max) / h); h = max; }
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              db.ref('settings/promos/slide_' + slot).set({ title: title, gambar: canvas.toDataURL('image/webp', 0.4), timestamp: Date.now() }).then(() => { event.target.value = ''; });
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        },

          }
          this.merchantAccountForm = { email: this.merchantForm.email || '', password: '' };

          this.$nextTick(() => {
            let lat = Number(this.merchantForm.lat || -2.9818); 
            let lng = Number(this.merchantForm.lng || 112.9739);

            const updateLokasiOtomatis = (newLat, newLng) => {
              this.merchantForm.lat = newLat; 
              this.merchantForm.lng = newLng;
              this.merchantForm.alamat_lengkap = "Mencari alamat lokasi..."; 
              
              fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${newLat}&lon=${newLng}`)
                .then(r => r.json())
                .then(d => { 
                  if(d && d.display_name) {
                    this.merchantForm.alamat_lengkap = d.display_name; 
                  } else {
                    this.merchantForm.alamat_lengkap = `${newLat}, ${newLng}`;
                  }
                }).catch(()=>{
                  this.merchantForm.alamat_lengkap = `${newLat}, ${newLng}`;
                });
            };
            
            if (!googleMapToko) {
              googleMapToko = new google.maps.Map(document.getElementById('google-toko-map'), {
                center: { lat, lng },
                zoom: 15,
                gestureHandling: 'greedy'
              });

              googleMarkerToko = new google.maps.Marker({
                position: { lat, lng },
                map: googleMapToko,
                draggable: true
              });

              google.maps.event.addListener(googleMarkerToko, 'dragend', (event) => {
                updateLokasiOtomatis(event.latLng.lat(), event.latLng.lng());
              });

              google.maps.event.addListener(googleMapToko, 'click', (event) => {
                googleMarkerToko.setPosition(event.latLng); 
                googleMapToko.panTo(event.latLng); 
                updateLokasiOtomatis(event.latLng.lat(), event.latLng.lng());
              });

            } else {
              google.maps.event.trigger(googleMapToko, 'resize');
              googleMapToko.setCenter({ lat, lng });
              googleMarkerToko.setPosition({ lat, lng });
            }
          });
        },

        getCurrentLocation() {
          if (!navigator.geolocation) {
            alert('❌ Geolocation / GPS tidak didukung oleh browser Anda.');
            return;
          }

          this.isLocating = true;

          navigator.geolocation.getCurrentPosition(
            (position) => {
              let lat = position.coords.latitude;
              let lng = position.coords.longitude;

              this.merchantForm.lat = lat;
              this.merchantForm.lng = lng;

              if (googleMapToko && googleMarkerToko) {
                googleMapToko.setCenter({ lat, lng });
                googleMarkerToko.setPosition({ lat, lng });
                googleMapToko.setZoom(17);
              }

              fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                .then(r => r.json())
                .then(d => {
                  if (d && d.display_name) {
                    this.merchantForm.alamat_lengkap = d.display_name;
                  } else {
                    this.merchantForm.alamat_lengkap = `${lat}, ${lng}`;
                  }
                })
                .catch(() => {
                  this.merchantForm.alamat_lengkap = `${lat}, ${lng}`;
                })
                .finally(() => {
                  this.isLocating = false;
                  alert('✅ Lokasi GPS berhasil ditemukan & diterapkan ke peta!');
                });
            },
            (error) => {
              this.isLocating = false;
              let msg = '❌ Gagal mengambil lokasi GPS.';
              if (error.code === error.PERMISSION_DENIED) {
                msg = '❌ Akses lokasi ditolak. Harap izinkan akses lokasi (GPS) pada browser/perangkat Anda.';
              } else if (error.code === error.POSITION_UNAVAILABLE) {
                msg = '❌ Informasi lokasi tidak tersedia.';
              } else if (error.code === error.TIMEOUT) {
                msg = '❌ Permintaan waktu lokasi GPS habis (timeout).';
              }
              alert(msg);
            },
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            }
          );
        },

        searchLocation() {
          let query = this.merchantForm.alamat_lengkap ? this.merchantForm.alamat_lengkap.trim() : '';
          if (!query) return alert('⚠ Masukkan alamat, koordinat, atau link Google Maps terlebih dahulu!');

          let coordRegex = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;
          let matchCoord = query.match(coordRegex);
          if (matchCoord) {
            let lat = parseFloat(matchCoord[1]), lon = parseFloat(matchCoord[2]);
            this.merchantForm.lat = lat; this.merchantForm.lng = lon;
            if (googleMapToko && googleMarkerToko) { googleMapToko.setCenter({ lat, lng: lon }); googleMarkerToko.setPosition({ lat, lng: lon }); }
            alert('✅ Titik koordinat berhasil diterapkan ke peta!');
            return;
          }

          let searchQuery = query.toLowerCase().includes('samuda') ? query : query + ', Samuda';
          fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}`)
            .then(res => res.json())
            .then(data => {
              if (data && data.length > 0) {
                let lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
                this.merchantForm.lat = lat; this.merchantForm.lng = lon;
                this.merchantForm.alamat_lengkap = data[0].display_name;
                if (googleMapToko && googleMarkerToko) { googleMapToko.setCenter({ lat, lng: lon }); googleMarkerToko.setPosition({ lat, lng: lon }); }
                alert('✅ Lokasi ditemukan di peta!');
              } else {
                alert('❌ Alamat tidak ditemukan.');
              }
            });
        },

        async saveMerchant() {
          if (!this.merchantForm.nama_toko) return alert('⚠️ Nama toko wajib diisi!');
          const isMitra = this.merchantForm.is_mitra === true;
          const email = String(this.merchantAccountForm.email || this.merchantForm.email || '').trim().toLowerCase();
          const password = String(this.merchantAccountForm.password || '');
          if (isMitra && !this.merchantForm.uid && (!email || !password)) return alert('Toko Mitra wajib memiliki email dan kata sandi untuk akun Firebase.');
          if (isMitra && !this.merchantForm.uid && password.length < 6) return alert('Kata sandi minimal 6 karakter.');
          this.isSavingMerchant = true;
          let secondaryAuth = null;
          let createdUser = null;
          try {
            let uid = this.merchantForm.uid || '';
            if (isMitra && !uid) {
              // Gunakan Firebase app sekunder agar pembuatan akun mitra tidak mengeluarkan Admin.
              let secondaryApp;
              try { secondaryApp = firebase.app('merchantRegistrationApp'); }
              catch (_) { secondaryApp = firebase.initializeApp(firebaseConfig, 'merchantRegistrationApp'); }
              secondaryAuth = secondaryApp.auth();
              const credential = await secondaryAuth.createUserWithEmailAndPassword(email, password);
              createdUser = credential.user;
              uid = createdUser.uid;
              try { await createdUser.sendEmailVerification(); } catch (verificationError) { console.warn('Verifikasi email mitra belum terkirim:', verificationError); }
            }
            const merchantData = {
              ...this.merchantForm,
              foto_toko: this.merchantForm.foto_toko || '',
              is_mitra: isMitra,
              uid: isMitra ? uid : (this.merchantForm.uid || ''),
              email: isMitra ? email : '',
              auth_uid: isMitra ? uid : '',
              akun_dibuat_admin: isMitra && !!createdUser,
              diperbarui_pada: Date.now()
            };
            // Jangan pernah menyimpan kata sandi ke Realtime Database.
            delete merchantData.password;
            await db.ref('merchants/' + this.merchantForm.id).set(merchantData);
            this.showMerchantModal = false;
            this.merchantAccountForm = { email: '', password: '' };
            alert(isMitra
              ? '✅ Toko Mitra berhasil disimpan.\nEmail: ' + email + (createdUser ? '\nKata sandi awal: ' + password + '\nUID Firebase: ' + uid + '\n\nSimpan kata sandi ini sekarang; kata sandi tidak disimpan di database.' : '\nAkun Firebase yang terhubung tetap digunakan.') + '\n\nPemilik toko dapat menggunakan akun ini untuk masuk ke aplikasi Mitra.'
              : '✅ Toko non-mitra berhasil disimpan. Toko ini tidak memerlukan akun email dan kata sandi.');
          } catch(e) {
            console.error('Gagal menyimpan toko/akun mitra:', e);
            let msg = e && e.message ? e.message : 'Terjadi kesalahan.';
            if (e && e.code === 'auth/email-already-in-use') msg = 'Email ini sudah terdaftar di Firebase Authentication. Gunakan email lain atau hubungkan akun yang sudah ada melalui proses login mitra.';
            else if (e && e.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
            else if (e && e.code === 'auth/weak-password') msg = 'Kata sandi terlalu lemah. Gunakan minimal 6 karakter.';
            else if (e && e.code === 'auth/operation-not-allowed') msg = 'Login Email/Kata Sandi belum diaktifkan di Firebase Authentication.';
            alert('❌ Gagal menyimpan toko: ' + msg + (createdUser ? '\nAkun Auth sudah dibuat dengan UID ' + createdUser.uid + ', tetapi profil toko mungkin belum tersimpan.' : ''));
          } finally {
            if (secondaryAuth) { try { await secondaryAuth.signOut(); } catch (_) {} }
            this.isSavingMerchant = false;
          }
        },

        saveCustomer() { 
          if(!this.customerForm.uid) return alert('⚠️ UID pelanggan tidak valid!');
          if(!this.customerForm.nama || !this.customerForm.no_hp) return alert('⚠ Nama dan Nomor HP wajib diisi!');
          
          let cleanHp = this.customerForm.no_hp.trim().replace(/[^0-9]/g, '');
          let targetUid = this.customerForm.uid;

          let oldCustomer = this.customers.find(c => c.uid === targetUid);
          let oldSaldo = oldCustomer ? Number(oldCustomer.saldo || 0) : 0;
          let newSaldo = Number(this.customerForm.saldo || 0);

          db.ref('customers/' + targetUid).update({
            nama: this.customerForm.nama,
            email: this.customerForm.email || '',
            no_hp: cleanHp,
            saldo: newSaldo,
            status: this.customerForm.status || 'aktif'
          }).then(() => {
            if (oldSaldo !== newSaldo) {
              let selisih = newSaldo - oldSaldo;
              db.ref('mutasi_saldo').push({
                user_id: targetUid,
                nominal: Math.abs(selisih),
                jenis: selisih > 0 ? 'IN' : 'OUT',
                keterangan: 'Penyesuaian Saldo oleh Admin',
                timestamp: Date.now()
              });
            }

            this.showCustomerModal = false;
            alert('✅ Data pelanggan berhasil diperbarui!');
          }).catch(err => {
            alert('❌ Gagal menyimpan data: ' + err.message);
          }); 
        },

        deleteCustomer(uid) { 
          if(confirm('Hapus data pelanggan ini dari database Realtime?')) {
            db.ref('customers/' + uid).remove().then(() => {
              alert('✅ Data pelanggan berhasil dihapus!');
            });
          }
        },

        openOrderMap(ord) {
          this.activeMapOrder = ord;
          this.showOrderMapModal = true;
          
          this.$nextTick(() => {
            let latJ = Number(ord.lat_jemput || -2.9818); 
            let lngJ = Number(ord.lng_jemput || 112.9739);
            let latT = Number(ord.lat_tujuan || -2.9830); 
            let lngT = Number(ord.lng_tujuan || 112.9750);
            
            if (!googleMapOrder) {
              googleMapOrder = new google.maps.Map(document.getElementById('google-order-map'), {
                center: { lat: latJ, lng: lngJ },
                zoom: 14,
                gestureHandling: 'greedy'
              });
            } else {
              google.maps.event.trigger(googleMapOrder, 'resize');
            }

            if (googleMarkerAsal) googleMarkerAsal.setMap(null);
            if (googleMarkerTujuan) googleMarkerTujuan.setMap(null);

            googleMarkerAsal = new google.maps.Marker({
              position: { lat: latJ, lng: lngJ },
              map: googleMapOrder,
              title: 'Titik Penjemputan'
            });

            googleMarkerTujuan = new google.maps.Marker({
              position: { lat: latT, lng: lngT },
              map: googleMapOrder,
              title: 'Titik Tujuan'
            });

            let directionsService = new google.maps.DirectionsService();
            let directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(googleMapOrder);

            directionsService.route({
              origin: { lat: latJ, lng: lngJ },
              destination: { lat: latT, lng: lngT },
              travelMode: google.maps.TravelMode.DRIVING
            }, (response, status) => {
              if (status === 'OK') {
                directionsRenderer.setDirections(response);
              }
            });
          });
        }
      }));
    });
  </script>
</body>
</html>
