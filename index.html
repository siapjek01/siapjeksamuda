<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>SiapJek - Pelanggan</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app-frame{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#fff;z-index:1;opacity:1}
#splash{display:none!important;position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#15965b 0%,#087443 54%,#045331 100%);opacity:1;transition:opacity .22s ease}
#splash:before{content:"";position:absolute;width:70vw;height:70vw;max-width:420px;max-height:420px;border:1px solid #ffffff12;border-radius:50%;box-shadow:0 0 0 26px #ffffff08,0 0 0 54px #ffffff05}
#splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{display:grid;place-items:center;width:150px;height:150px;color:#ff8a00;font-size:66px;font-weight:1000;letter-spacing:-8px;font-style:italic;line-height:1;padding-right:8px;text-shadow:0 4px 18px #003b2540;user-select:none}
.loader{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff30;border-top-color:#ff8a00;border-right-color:#ffad33;animation:spin .8s linear infinite;margin-top:18px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:380px){.logo{width:128px;height:128px;font-size:58px}.loader{width:30px;height:30px;margin-top:14px}}
@media(prefers-reduced-motion:reduce){.loader{animation:none;border-top-color:#ff8a00}}
</style>
</head>
<body>
<div id="splash" aria-label="Memuat SiapJek">
  <div id="splash-inner">
    <div class="logo" aria-hidden="true">SJ</div>
    <div class="loader" aria-hidden="true"></div>
  </div>
</div>
<iframe id="app-frame" title="SiapJek Pelanggan" allow="geolocation; camera; microphone; encrypted-media; autoplay; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
'use strict';
const SOURCE_PATH='source_code/pelanggan';
const MODE_PATH='loader_settings/mode';
const LINK_PATH='customer_link';
const config={
  apiKey:"AIzaSyB_Ndbf9idBUkMb5aNU-Bc8qZIEVI90Ddk",
  authDomain:"siapjek-8d69c.firebaseapp.com",
  databaseURL:"https://siapjek-8d69c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"siapjek-8d69c"
};
const splash=document.getElementById('splash');
const frame=document.getElementById('app-frame');
let refs=[], lastSource='', failTimer=null, fadeTimer=null, retryTimer=null;
let requestId=0, isReady=false, mode='source', modeLoaded=false, sourceLoaded=false, linkLoaded=false;
let sourceValue=null, linkValue=null, started=false;

function clearTimers(){
  if(failTimer){clearTimeout(failTimer);failTimer=null;}
  if(fadeTimer){clearTimeout(fadeTimer);fadeTimer=null;}
  if(retryTimer){clearTimeout(retryTimer);retryTimer=null;}
}
function showSplash(){
  // Tidak menampilkan layar loader; biarkan WebView kosong/putih
  // sampai aplikasi pelanggan selesai dimuat.
  splash.style.display='none';
  frame.style.display='block';
  frame.style.opacity='1';
}
function revealApp(id){
  if(id!==requestId)return;
  if(failTimer){clearTimeout(failTimer);failTimer=null;}
  isReady=true;
  splash.style.display='none';
  frame.style.display='block';
  frame.style.opacity='1';
}
function parseSource(value){
  if(typeof value==='string')return value.trim();
  if(value&&typeof value==='object'){
    for(const key of ['url','link','html','code','source','srcdoc']){
      if(typeof value[key]==='string'&&value[key].trim())return value[key].trim();
    }
  }
  return '';
}
function isUrl(value){
  try{const u=new URL(value);return (u.protocol==='https:'||u.protocol==='http:')&&!!u.hostname;}
  catch(e){return false;}
}
function scheduleRetry(){
  if(retryTimer)clearTimeout(retryTimer);
  retryTimer=setTimeout(start,4000);
}
function load(value){
  const source=parseSource(value);
  if(!source || (mode==='link' && !isUrl(source))){
    isReady=false;lastSource='';showSplash();return;
  }
  if(source===lastSource && (frame.getAttribute('src')||frame.getAttribute('srcdoc'))){
    if(isReady)revealApp(requestId);
    return;
  }
  lastSource=source;
  const id=++requestId;
  isReady=false;
  showSplash();
  frame.onload=function(){if(id===requestId)revealApp(id);};
  if(isUrl(source)){
    frame.removeAttribute('srcdoc');
    frame.src=source;
  }else{
    frame.removeAttribute('src');
    frame.srcdoc=source;
  }
  if(failTimer)clearTimeout(failTimer);
  failTimer=setTimeout(function(){
    if(id!==requestId)return;
    if(!isReady){lastSource='';scheduleRetry();}
  },15000);
}
function updateActiveSource(){
  if(!modeLoaded)return;
  if(mode==='link'){
    if(!linkLoaded)return;
    if(!parseSource(linkValue)){lastSource='';isReady=false;showSplash();return;}
    load(linkValue);
  }else{
    if(!sourceLoaded)return;
    if(!parseSource(sourceValue)){lastSource='';isReady=false;showSplash();return;}
    load(sourceValue);
  }
}
function detach(){
  refs.forEach(function(item){try{item.ref.off('value',item.callback);}catch(e){}});
  refs=[];
}
function start(){
  if(retryTimer){clearTimeout(retryTimer);retryTimer=null;}
  detach();
  modeLoaded=sourceLoaded=linkLoaded=false;
  mode='source';sourceValue=linkValue=null;
  showSplash();
  try{
    if(!window.firebase||!firebase.database){scheduleRetry();return;}
    if(!firebase.apps.length)firebase.initializeApp(config);
    const db=firebase.database();
    function listen(path,handler){
      const ref=db.ref(path);
      const callback=function(snapshot){handler(snapshot);};
      refs.push({ref:ref,callback:callback});
      ref.on('value',callback,function(){scheduleRetry();});
    }
    listen(MODE_PATH,function(snap){
      mode=snap.val()==='link'?'link':'source';
      modeLoaded=true;updateActiveSource();
    });
    listen(SOURCE_PATH,function(snap){
      sourceValue=snap.exists()?snap.val():null;
      sourceLoaded=true;updateActiveSource();
    });
    listen(LINK_PATH,function(snap){
      linkValue=snap.exists()?snap.val():null;
      linkLoaded=true;updateActiveSource();
    });
  }catch(e){scheduleRetry();}
}
window.addEventListener('online',start);
window.addEventListener('offline',function(){showSplash();});
start();
})();
</script>
</body>
</html>
