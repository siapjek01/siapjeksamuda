<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SiapJek - Pelanggan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background-color: #0f172a;
      position: fixed;
      inset: 0;
    }
    #app-frame {
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans">

  <!-- Tampilan Loading Awal -->
  <div id="app-loading" class="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center space-y-4 z-50 p-6 text-center">
    <div class="w-16 h-16 bg-gradient-to-tr from-orange-500 to-amber-400 rounded-2xl flex items-center justify-center font-black text-2xl shadow-xl animate-bounce">
      SJ
    </div>
    <div class="space-y-1">
      <h3 class="text-sm font-black text-slate-200">SiapJek Pelanggan</h3>
      <p class="text-xs text-slate-400 font-medium">Memuat aplikasi, mohon tunggu...</p>
    </div>
  </div>

  <!-- Iframe dengan dukungan penuh untuk Google Maps, Mapbox, dan Sensor GPS -->
  <iframe 
    id="app-frame" 
    allow="geolocation; camera; microphone; encrypted-media; display-capture; autoplay; clipboard-read; clipboard-write; storage-access"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
    style="display: none;">
  </iframe>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB_Ndbf9idBUkMb5aNU-Bc8qZIEVI90Ddk",
      authDomain: "siapjek-8d69c.firebaseapp.com",
      databaseURL: "https://siapjek-8d69c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "siapjek-8d69c"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Mengirim perintah kembali dari Android/loader ke halaman pelanggan di iframe.
    // Aplikasi pelanggan hasil perbaikan mendengarkan pesan SIAPJEK_ANDROID_BACK.
    function teruskanTombolKembaliKePelanggan() {
      const iframe = document.getElementById('app-frame');
      if (!iframe || !iframe.contentWindow) return false;

      try {
        iframe.contentWindow.postMessage({ type: 'SIAPJEK_ANDROID_BACK' }, '*');
        return true;
      } catch (error) {
        console.warn('SiapJek: perintah kembali gagal diteruskan.', error);
        return false;
      }
    }

    // Dipanggil oleh kode Android WebView, misalnya:
    // webView.evaluateJavascript("window.dispatchEvent(new Event('siapjekAndroidBack'));", null)
    window.addEventListener('siapjekAndroidBack', function () {
      teruskanTombolKembaliKePelanggan();
    });

    // Dukungan tambahan jika perintah kembali diteruskan sebagai postMessage ke loader.
    window.addEventListener('message', function (event) {
      if (event.data && event.data.type === 'SIAPJEK_ANDROID_BACK') {
        teruskanTombolKembaliKePelanggan();
      }
    });

    function tampilkanPesanGagal(judul, pesan) {
      const loadingEl = document.getElementById('app-loading');
      loadingEl.innerHTML = '';

      const icon = document.createElement('div');
      icon.className = 'w-12 h-12 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center text-xl font-bold mb-2';
      icon.textContent = '⚠';

      const heading = document.createElement('p');
      heading.className = 'text-slate-100 text-sm font-bold';
      heading.textContent = judul;

      const detail = document.createElement('p');
      detail.className = 'text-slate-400 text-xs mt-2 break-words';
      detail.textContent = pesan || 'Periksa koneksi internet lalu coba lagi.';

      const button = document.createElement('button');
      button.className = 'mt-4 bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-md';
      button.textContent = 'Coba Lagi 🔄';
      button.addEventListener('click', function () { location.reload(); });

      loadingEl.append(icon, heading, detail, button);
      loadingEl.style.display = 'flex';
    }

    // Loader mendukung dua sumber yang dipilih dari Admin:
    // loader_settings/mode = "source" atau "link"
    // source -> source_code/pelanggan (HTML)
    // link   -> customer_link (URL hosting)
    function muatAplikasiPelanggan() {
      const loadingEl = document.getElementById('app-loading');
      const iframe = document.getElementById('app-frame');

      let mode = 'source'; // mode default jika pengaturan belum dibuat
      let modeSudahDibaca = false;
      let sourceCode = '';
      let sourceSudahDibaca = false;
      let customerLink = '';
      let linkSudahDibaca = false;
      let sumberAktif = '';
      let nomorPemuatan = 0;

      function tampilkanMemuat(pesan) {
        loadingEl.innerHTML = `
          <div class="w-16 h-16 bg-gradient-to-tr from-orange-500 to-amber-400 rounded-2xl flex items-center justify-center font-black text-2xl shadow-xl animate-bounce">SJ</div>
          <div class="space-y-1">
            <h3 class="text-sm font-black text-slate-200">SiapJek Pelanggan</h3>
            <p class="text-xs text-slate-400 font-medium">${pesan || 'Memuat aplikasi, mohon tunggu...'}</p>
          </div>`;
        loadingEl.style.display = 'flex';
      }

      function kosongkanIframe() {
        iframe.onload = null;
        iframe.onerror = null;
        iframe.style.display = 'none';
        iframe.removeAttribute('srcdoc');
        iframe.src = 'about:blank';
      }

      function renderSumberAktif() {
        if (!modeSudahDibaca) return;

        if (mode === 'link') {
          if (!linkSudahDibaca) return;
          if (!customerLink) {
            sumberAktif = '';
            kosongkanIframe();
            tampilkanPesanGagal('Link aplikasi pelanggan belum diatur.', 'Buka Admin SiapJek → Pengaturan Link Aplikasi Loader Pelanggan, isi URL hosting yang diawali https://, lalu tekan Perbarui Link.');
            return;
          }

          let url;
          try {
            url = new URL(customerLink);
          } catch (_) {
            sumberAktif = '';
            kosongkanIframe();
            tampilkanPesanGagal('Link hosting tidak valid.', 'Periksa URL pada Admin. Contoh: https://nama-aplikasi.web.app');
            return;
          }
          if (!['https:', 'http:'].includes(url.protocol)) {
            sumberAktif = '';
            kosongkanIframe();
            tampilkanPesanGagal('Protokol link tidak didukung.', 'Gunakan URL hosting yang diawali https:// atau http://. HTTPS lebih disarankan.');
            return;
          }

          const target = url.href;
          const key = 'link:' + target;
          if (sumberAktif === key) return;
          sumberAktif = key;
          const requestId = ++nomorPemuatan;
          tampilkanMemuat('Membuka aplikasi dari link hosting...');
          iframe.onload = function () {
            if (requestId !== nomorPemuatan) return;
            iframe.style.display = 'block';
            loadingEl.style.display = 'none';
          };
          iframe.onerror = function () {
            if (requestId !== nomorPemuatan) return;
            tampilkanPesanGagal('Gagal membuka link hosting.', 'Pastikan URL hosting benar, aktif, dan dapat dibuka di browser.');
          };
          iframe.removeAttribute('srcdoc');
          iframe.src = target;
          iframe.style.display = 'block';
          return;
        }

        // Mode source code Firebase
        if (!sourceSudahDibaca) return;
        if (!sourceCode.trim()) {
          sumberAktif = '';
          kosongkanIframe();
          tampilkanPesanGagal('Kode aplikasi pelanggan belum tersedia.', 'Pilih Source Code Firebase di Admin dan simpan HTML melalui Editor Kode App → Simpan Pelanggan.');
          return;
        }

        const key = 'source:' + sourceCode;
        if (sumberAktif === key) return;
        sumberAktif = key;
        const requestId = ++nomorPemuatan;
        tampilkanMemuat('Memuat source code pelanggan dari Firebase...');
        iframe.onload = function () {
          if (requestId !== nomorPemuatan) return;
          iframe.style.display = 'block';
          loadingEl.style.display = 'none';
        };
        iframe.onerror = function () {
          if (requestId !== nomorPemuatan) return;
          tampilkanPesanGagal('Gagal membuka source code pelanggan.', 'Periksa isi HTML dan izin akses Firebase.');
        };
        iframe.removeAttribute('src');
        iframe.srcdoc = sourceCode;
        iframe.style.display = 'block';
      }

      // Mode aktif dari menu pengaturan loader di Admin. Default aman: source code.
      db.ref('loader_settings/mode').on('value', function (snap) {
        const raw = snap.exists() ? snap.val() : 'source';
        mode = raw === 'link' ? 'link' : 'source';
        modeSudahDibaca = true;
        sumberAktif = '';
        kosongkanIframe();
        tampilkanMemuat(mode === 'link' ? 'Menyiapkan link hosting...' : 'Menyiapkan source code...');
        renderSumberAktif();
      }, function (err) {
        // Jika setting tidak dapat dibaca, jangan berpindah ke link tanpa izin; pakai source.
        mode = 'source';
        modeSudahDibaca = true;
        renderSumberAktif();
        console.error('Gagal membaca loader_settings/mode:', err);
      });

      // Listener real-time source code; digunakan saat mode source dipilih.
      db.ref('source_code/pelanggan').on('value', function (snap) {
        sourceCode = snap.exists() && typeof snap.val() === 'string' ? snap.val() : '';
        sourceSudahDibaca = true;
        if (mode === 'source') {
          sumberAktif = '';
          renderSumberAktif();
        }
      }, function (err) {
        sourceSudahDibaca = true;
        sourceCode = '';
        if (mode === 'source') tampilkanPesanGagal('Gagal membaca source code Firebase.', err && err.message ? err.message : 'Periksa koneksi internet dan aturan akses Firebase.');
      });

      // Listener real-time link hosting; digunakan saat mode link dipilih.
      db.ref('customer_link').on('value', function (snap) {
        const value = snap.exists() ? snap.val() : '';
        customerLink = typeof value === 'string' ? value.trim() : '';
        linkSudahDibaca = true;
        if (mode === 'link') {
          sumberAktif = '';
          renderSumberAktif();
        }
      }, function (err) {
        linkSudahDibaca = true;
        customerLink = '';
        if (mode === 'link') tampilkanPesanGagal('Gagal membaca link hosting dari Firebase.', err && err.message ? err.message : 'Periksa koneksi internet dan aturan akses Firebase.');
      });
    }
    muatAplikasiPelanggan();
  </script>
</body>
</html>
